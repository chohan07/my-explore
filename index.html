<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Explore Gallery</title>
  <style>
    :root {
      --bg-color: #0b0f17;
      --card-bg: #161b26;
      --accent-color: #6366f1;
      --accent-hover: #4f46e5;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: #262c3a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
    }

    /* 사이드바 */
    aside {
      width: 240px;
      padding: 24px 16px;
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: sticky;
      top: 0;
      height: 100vh;
    }
    .logo {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .nav-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .nav-item {
      padding: 10px 14px;
      border-radius: 8px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }
    .nav-item:hover, .nav-item.active {
      background-color: #1e2638;
      color: #fff;
    }

    /* 메인 영역 */
    main {
      flex: 1;
      padding: 24px 32px;
      overflow-y: auto;
    }

    /* 헤더 & 검색바 */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      gap: 16px;
    }
    .search-box {
      position: relative;
      flex: 1;
      max-width: 600px;
    }
    .search-box input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box input:focus { border-color: var(--accent-color); }
    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .file-input-btn {
      background-color: var(--accent-color);
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      display: inline-block;
      transition: background 0.2s;
    }
    .file-input-btn:hover { background-color: var(--accent-hover); }

    /* Masonry 컬럼 레이아웃 */
    .masonry-grid {
      column-count: 4;
      column-gap: 16px;
    }
    @media (max-width: 1200px) { .masonry-grid { column-count: 3; } }
    @media (max-width: 800px) { .masonry-grid { column-count: 2; } }
    @media (max-width: 500px) { .masonry-grid { column-count: 1; } }

    /* 카드 스타일 */
    .card {
      break-inside: avoid;
      margin-bottom: 16px;
      background-color: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      border: 1px solid transparent;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: var(--border-color);
    }
    .card img {
      width: 100%;
      display: block;
      border-radius: 12px 12px 0 0;
      object-fit: cover;
    }
    .card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 60%);
      opacity: 0;
      transition: opacity 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 16px;
    }
    .card:hover .card-overlay { opacity: 1; }
    .card-title { font-size: 1rem; font-weight: 600; margin-bottom: 4px; }
    .card-prompt {
      font-size: 0.8rem;
      color: #d1d5db;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .like-btn {
      background: rgba(255, 255, 255, 0.15);
      border: none;
      color: #fff;
      padding: 4px 10px;
      border-radius: 20px;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: background 0.2s;
    }
    .like-btn:hover { background: rgba(255, 255, 255, 0.3); }

    /* 모달 */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: var(--card-bg);
      max-width: 900px;
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      max-height: 85vh;
      border: 1px solid var(--border-color);
    }
    .modal-img-container {
      flex: 1.2;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-img-container img { max-width: 100%; max-height: 85vh; object-fit: contain; }
    .modal-info {
      flex: 1;
      padding: 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-y: auto;
    }
    .prompt-box {
      background: #0d1117;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      font-family: monospace;
      font-size: 0.85rem;
      margin: 12px 0;
      word-break: break-all;
      color: #e5e7eb;
    }
    .copy-btn {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      align-self: flex-start;
      margin-bottom: 16px;
    }
    .close-modal {
      align-self: flex-end;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 사이드바 Navigation -->
  <!-- 사이드바 Navigation -->
  <aside>
    <div class="logo">✨ CNS Gallery</div>
    <ul class="nav-list">
      <li class="nav-item active" onclick="filterCategory('All')">🔍 Explore All</li>
      <li class="nav-item" onclick="filterCategory('3D / Art')">🎨 3D & Art</li>
      <li class="nav-item" onclick="filterCategory('Concept')">🌆 Concept Art</li>
      <li class="nav-item" onclick="filterCategory('Space')">🚀 Space</li>
      <li class="nav-item" onclick="filterCategory('Portrait')">🖼️ Portrait</li>
      <li class="nav-item" onclick="filterCategory('Nature')">🌿 Nature</li>
    </ul>
  </aside>

  <!-- 메인 컨텐츠 영역 -->
  <main>
    <div class="top-bar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Search title, prompt, or tags..." oninput="handleSearch()">
      </div>
      <!-- 외부 CSV 불러오기 버튼 -->
      <label class="file-input-btn">
        📄 Load Custom CSV
        <input type="file" id="csvFileInput" accept=".csv" style="display:none" onchange="loadExternalCSV(event)">
      </label>
    </div>

    <!-- Masonry 갤러리 -->
    <div class="masonry-grid" id="galleryGrid"></div>
  </main>

  <!-- 상세 이미지 모달 -->
  <div class="modal" id="imageModal">
    <div class="modal-content">
      <div class="modal-img-container">
        <img id="modalImg" src="" alt="Detail view">
      </div>
      <div class="modal-info">
        <div>
          <button class="close-modal" onclick="closeModal()">✕</button>
          <h2 id="modalTitle" style="margin-bottom: 8px;"></h2>
          <p style="color: var(--text-muted); font-size: 0.85rem;" id="modalMeta"></p>
          
          <div style="margin-top: 16px;">
            <label style="font-size: 0.8rem; color: var(--text-muted);">PROMPT</label>
            <div class="prompt-box" id="modalPrompt"></div>
            <button class="copy-btn" onclick="copyPrompt()">📋 Copy Prompt</button>
          </div>
        </div>
        <div style="font-size: 0.85rem; color: var(--text-muted);" id="modalTags"></div>
      </div>
    </div>
  </div>

  <script>
    let galleryData = [];

    // 기본 gallery.csv 자동 불러오기
    window.addEventListener('DOMContentLoaded', () => {
      fetch('gallery.csv')
        .then(res => res.text())
        .then(csvText => {
          parseCSV(csvText);
        })
        .catch(() => {
          console.warn("gallery.csv 불러오기 실패. 기본 테스트 데이터 세팅.");
        });
    });

    // CSV 파싱 엔진
    function parseCSV(text) {
      const lines = text.trim().split('\n');
      if (lines.length < 2) return;

      const headers = lines[0].split(',').map(h => h.trim());
      galleryData = lines.slice(1).map(line => {
        // 큰따옴표안 컴마 처리 정규식
        const values = line.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || [];
        const item = {};
        headers.forEach((header, index) => {
          let val = values[index] ? values[index].trim() : '';
          if (val.startsWith('"') && val.endsWith('"')) {
            val = val.substring(1, val.length - 1);
          }
          item[header] = val;
        });
        return item;
      });

      renderGallery(galleryData);
    }

    // 외부 CSV 로드 함수
    function loadExternalCSV(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        parseCSV(e.target.result);
      };
      reader.readAsText(file);
    }

    // 갤러리 그리드 렌더링
    function renderGallery(items) {
      const grid = document.getElementById('galleryGrid');
      grid.innerHTML = '';

      items.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openModal(item);

        card.innerHTML = `
          <img src="${item.image}" alt="${item.title}" loading="lazy">
          <div class="card-overlay">
            <div class="card-title">${item.title || 'Untitled'}</div>
            <div class="card-prompt">${item.prompt || ''}</div>
            <div class="card-meta">
              <span>by ${item.author || 'Anonymous'}</span>
              <button class="like-btn" onclick="event.stopPropagation(); addLike(${index}, this)">
                ❤️ ${item.likes || 0}
              </button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // 실시간 검색
    function handleSearch() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = galleryData.filter(item => 
        (item.title && item.title.toLowerCase().includes(query)) ||
        (item.prompt && item.prompt.toLowerCase().includes(query)) ||
        (item.tags && item.tags.toLowerCase().includes(query))
      );
      renderGallery(filtered);
    }

    // 카테고리 필터
    function filterCategory(cat) {
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      event.target.classList.add('active');

      if (cat === 'All') {
        renderGallery(galleryData);
      } else {
        const filtered = galleryData.filter(item => item.category === cat);
        renderGallery(filtered);
      }
    }

    // 좋아요 기능
    function addLike(index, btn) {
      let likes = parseInt(galleryData[index].likes || 0);
      likes++;
      galleryData[index].likes = likes;
      btn.innerHTML = `❤️ ${likes}`;
    }

    // 상세보기 모달
    function openModal(item) {
      document.getElementById('modalImg').src = item.image;
      document.getElementById('modalTitle').innerText = item.title || 'Untitled';
      document.getElementById('modalMeta').innerText = `Created by ${item.author || 'Me'} • ${item.date || ''}`;
      document.getElementById('modalPrompt').innerText = item.prompt || 'No prompt provided.';
      document.getElementById('modalTags').innerText = item.tags ? `Tags: ${item.tags}` : '';
      document.getElementById('imageModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('imageModal').classList.remove('active');
    }

    // 프롬프트 복사
    function copyPrompt() {
      const text = document.getElementById('modalPrompt').innerText;
      navigator.clipboard.writeText(text).then(() => {
        alert('Prompt copied to clipboard!');
      });
    }
  </script>
</body>
</html>
